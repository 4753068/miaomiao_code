<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>今日头条</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* --- 1. 基础重置 --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #f4f5f6;
            color: #222222;
            max-width: 500px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            border-left: 1px solid #e8e8e8;
            border-right: 1px solid #e8e8e8;
            position: relative;
        }

        /* --- 2. 顶部服务器故障提示栏 --- */
        .error-banner {
            background-color: #ffeef0;
            border-bottom: 1px solid #ffccd3;
            color: #f85959;
            padding: 11px 16px;
            font-size: 13.5px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            position: sticky;
            top: 0;
            z-index: 1001;
        }

        /* --- 3. 红色搜索头部 --- */
        .header-search {
            background-color: #d43d3d;
            padding: 9px 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            position: sticky;
            top: 40px; /* 紧跟在故障栏下方 */
            z-index: 1000;
        }

        .search-box {
            flex: 1;
            background-color: #ffffff;
            height: 32px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            padding: 0 12px;
            color: #707070;
            font-size: 13.5px;
            gap: 8px;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .publish-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #ffffff;
            font-size: 10px;
            cursor: pointer;
            width: 32px;
        }
        .publish-btn i {
            font-size: 18px;
            margin-bottom: 2px;
        }

        /* --- 4. 频道导航栏 --- */
        .nav-bar {
            display: flex;
            align-items: center;
            background-color: #ffffff;
            border-bottom: 1px solid #e8e8e8;
            height: 42px;
            padding: 0 4px 0 16px;
            position: sticky;
            top: 90px;
            z-index: 1000;
        }

        .nav-tabs {
            display: flex;
            gap: 20px;
            overflow-x: auto;
            white-space: nowrap;
            flex: 1;
        }
        .nav-tabs::-webkit-scrollbar { display: none; }

        .nav-item {
            font-size: 16px;
            color: #222222;
            line-height: 42px;
            position: relative;
            cursor: pointer;
        }
        .nav-item.active {
            color: #f85959;
            font-weight: bold;
        }
        .nav-item.has-dot::after {
            content: '';
            position: absolute;
            top: 10px;
            right: -6px;
            width: 5px;
            height: 5px;
            background-color: #f85959;
            border-radius: 50%;
        }

        .menu-more {
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #505050;
            font-size: 18px;
            cursor: pointer;
            box-shadow: -6px 0 10px -4px rgba(0,0,0,0.05);
            background: #fff;
        }

        /* --- 5. 主体新闻流卡片群 --- */
        .main-content {
            flex: 1;
            padding-bottom: 65px;
        }

        /* 通用卡片底座 */
        .news-card {
            background-color: #ffffff;
            padding: 16px;
            margin-bottom: 6px;
            border-bottom: 1px solid #f0f0f0;
        }

        .card-title {
            font-size: 17.5px;
            line-height: 1.45;
            color: #222222;
            margin-bottom: 10px;
            font-weight: 400;
        }

        .card-meta {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 11.5px;
            color: #999999;
        }

        /* 标签：置顶 / 广告 / 热点 */
        .badge {
            font-size: 10px;
            padding: 0 3px;
            border-radius: 2px;
            line-height: 1.3;
        }
        .badge-top { color: #f85959; border: 1px solid rgba(248,89,89,0.3); background: #fff0f0; }
        .badge-hot { color: #ff9800; border: 1px solid rgba(255,152,0,0.3); background: #fff8e1; }
        .badge-ad { color: #2f80ed; border: 1px solid rgba(47,128,237,0.3); }

        /* 多图/三图排列样式 */
        .image-grid {
            display: flex;
            gap: 4px;
            margin-bottom: 10px;
        }
        .image-grid img {
            flex: 1;
            width: 33.3%;
            aspect-ratio: 1.5;
            object-fit: cover;
            border-radius: 2px;
            background-color: #eaeaea;
        }

        /* 大图/单图样式 */
        .single-large-image {
            width: 100%;
            aspect-ratio: 1.8;
            object-fit: cover;
            border-radius: 4px;
            margin-bottom: 10px;
            background-color: #eaeaea;
        }

        /* 创作者/自媒体博主信息栏 */
        .author-section {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }
        .author-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .author-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            object-fit: cover;
            background: #e0e0e0;
        }
        .author-name {
            font-size: 14.5px;
            font-weight: bold;
            color: #333333;
        }
        .author-desc {
            font-size: 11px;
            color: #999999;
            margin-top: 1px;
        }
        .follow-btn {
            color: #f85959;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            border: 1px solid rgba(248,89,89,0.2);
            padding: 2px 10px;
            border-radius: 12px;
        }

        /* 纯文本段落 */
        .feed-text {
            font-size: 15.5px;
            line-height: 1.5;
            color: #222222;
            margin-bottom: 10px;
        }
        .hashtag { color: #2f80ed; margin-right: 4px; cursor: pointer; }

        /* 三键底部点赞互动栏 */
        .action-bar {
            border-top: 1px solid #f8f8f8;
            padding-top: 12px;
            margin-top: 6px;
            display: flex;
            justify-content: space-between;
            color: #666666;
            font-size: 13px;
        }
        .action-item {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            cursor: pointer;
        }
        .action-item:hover { color: #f85959; }

        /* --- 6. 底部固定 Tab 栏 --- */
        .footer-tabs {
            position: fixed;
            bottom: 0;
            width: 100%;
            max-width: 500px;
            height: 54px;
            background-color: #ffffff;
            border-top: 1px solid #e8e8e8;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
        }
        .tab-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #666666;
            cursor: pointer;
            font-size: 10.5px;
        }
        .tab-item i {
            font-size: 21px;
            margin-bottom: 2px;
        }
        .tab-item.active { color: #f85959; }

        .center-money .money-icon {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, #ff9800, #ff5722);
            color: #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 10.5px;
            box-shadow: 0 2px 6px rgba(255,87,34,0.3);
            line-height: 1.1;
            text-align: center;
        }

        /* 加载动画提示 */
        .loading-tip {
            text-align: center;
            padding: 30px 0;
            color: #999;
            font-size: 14px;
            background: #fff;
        }
    </style>
</head>
<body>

<div class="error-banner" style="margin-top:35px">
    <i class="fa-solid fa-triangle-exclamation"></i> 服务器出现故障，我们正在努力修复
</div>

<div class="header-search">
    <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <span id="search-keyword">正在加载实时热点...</span>
    </div>
    <div class="publish-btn">
        <i class="fa-solid fa-camera"></i>
        <span>发布</span>
    </div>
</div>

<nav class="nav-bar">
    <div class="nav-tabs" id="nav-tabs-list">
        <div class="nav-item has-dot" onclick="switchChannel('follow', this)">关注</div>
        <div class="nav-item active" onclick="switchChannel('recommend', this)">推荐</div>
        <div class="nav-item" onclick="switchChannel('hot', this)">热点</div>
        <div class="nav-item" onclick="switchChannel('tech', this)">科技</div>
        <div class="nav-item" onclick="switchChannel('ent', this)">娱乐</div>
        <div class="nav-item">财经</div>
    </div>
    <div class="menu-more">
        <i class="fa-solid fa-bars"></i>
    </div>
</nav>

<main class="main-content" id="news-container">
    <div class="loading-tip">
        <i class="fa-solid fa-spinner fa-spin" style="font-size:20px; margin-bottom:8px;"></i>
        <br>正在自动采集同步最新内容...
    </div>
</main>

<footer class="footer-tabs">
    <div class="tab-item active"><i class="fa-solid fa-house"></i><span>首页</span></div>
    <div class="tab-item"><i class="fa-regular fa-circle-play"></i><span>西瓜视频</span></div>
    <div class="tab-item center-money"><div class="money-icon">十亿<br>现金</div></div>
    <div class="tab-item"><i class="fa-solid fa-bolt"></i><span>小视频</span></div>
    <div class="tab-item"><i class="fa-regular fa-user"></i><span>我的</span></div>
</footer>

<script>
    // 1. 本地高保真丰富的假数据仓（当外部网络采集接口失效或跨域时自动启用，保证内容极其丰富）
    const mockDatabase = {
        recommend: [
            { type: 'text', title: '暖人心扉！听习近平谈这些关于奋斗与创新的知心话', source: '新华网', comment: '4521', time: '1分钟前', isTop: true },
            { type: 'text', title: '高光时刻：新时代中国大国外交的非凡历程与全球印象', source: '人民日报', comment: '2890', time: '5分钟前', isTop: true },
            { type: 'feed', author: '浪潮电影', avatar: 'https://picsum.photos/id/1025/100/100', desc: '优质娱乐领域创作者', text: '<span class="hashtag">#头条抽奖#</span> 幸福不止，红包不停！关注我并转发，5.8元重磅现金红包抽50位粉丝，快来碰碰运气吧！', img: 'https://picsum.photos/id/1080/500/300', likes: '397', comments: '1395', shares: '1177' },
            { type: 'three-img', title: '中国最厉害的非遗出海女店主：一年卖出过亿销售额，海外客商争相订购', source: '中国青年报', comment: '321', time: '15分钟前', imgs: ['https://picsum.photos/id/20/200/150', 'https://picsum.photos/id/21/200/150', 'https://picsum.photos/id/22/200/150'] },
            { type: 'large-img', title: '科技冬奥与智能化升级：大批国产黑科技设备正式退役并投入民用生产', source: '科技日报', comment: '84', time: '30分钟前', img: 'https://picsum.photos/id/1042/500/280' }
        ],
        tech: [
            { type: 'text', title: '苹果官网确认：又一款经典iPhone被列入停产名单，一个时代彻底终结', source: '晓薇科技报', comment: '141', time: '20分钟前' },
            { type: 'three-img', title: '国产全固态电池宣布重大突破！能量密度翻倍，新能源汽车续航将轻松破千公里', source: '极客视点', comment: '1842', time: '1小时前', imgs: ['https://picsum.photos/id/180/200/150', 'https://picsum.photos/id/181/200/150', 'https://picsum.photos/id/182/200/150'] },
            { type: 'large-img', title: '全球最大光伏发电基地在西北大漠正式并网发电设备，占地面积相当于半个巴黎', source: '环球科学', comment: '932', time: '2小时前', img: 'https://picsum.photos/id/98/500/280' },
            { type: 'text', title: '量子计算机商用化更近一步：科研团队成功解决超导量子比特的长寿命瓶颈问题', source: '中科院物理所', comment: '442', time: '3小时前' }
        ],
        hot: [
            { type: 'text', title: '1. 春节档总票房正式冲破100亿大关，创下影史同期新高', source: '头条热点', comment: '9.8万', time: '实时', isHot: true },
            { type: 'text', title: '2. 某互联网大厂突发底层服务器短暂故障，官方回应：正在加紧修复', source: '财经热榜', comment: '5.2万', time: '实时', isHot: true },
            { type: 'text', title: '3. 新一轮强冷空气将席卷中东部，部分地区局部降温超过12℃', source: '中央气象台', comment: '4.1万', time: '12分钟前' },
            { type: 'text', title: '4. 专家建议：年轻人首套房公积金贷款额度可适当上浮，减轻首付压力', source: '中国房产报', comment: '3.3万', time: '25分钟前' }
        ]
    };

    // 页面初始化加载
    window.addEventListener('DOMContentLoaded', () => {
        autoFetchAndRender();
    });

    // 核心功能：全自动尝试远程采集，失败则无缝激活备用富文本库
    async function autoFetchAndRender() {
        const container = document.getElementById('news-container');

        try {
            // 自动尝试采集公共头条热榜源
            const response = await fetch('https://api.vvhan.com/api/hotlist/toutiao');
            const result = await response.json();

            if (result.success && result.data && result.data.length > 0) {
                container.innerHTML = ''; // 清空加载状态

                // 同步更新顶部搜索框滚动热词
                document.getElementById('search-keyword').innerText = result.data[0].title;

                // 循环生成丰富饱满的真实实时采集卡片
                result.data.forEach((item, index) => {
                    const card = document.createElement('div');
                    card.className = 'news-card';

                    // 交替赋予不同的布局，让内容看起来极其丰富（有单图、有多图、有纯文本）
                    if (index % 3 === 1) {
                        card.innerHTML = `
                            <h2 class="card-title">${index + 1}. ${item.title}</h2>
                            <div class="image-grid">
                                <img src="https://picsum.photos/id/${index + 50}/150/100" alt="配图">
                                <img src="https://picsum.photos/id/${index + 51}/150/100" alt="配图">
                                <img src="https://picsum.photos/id/${index + 52}/150/100" alt="配图">
                            </div>
                            <div class="card-meta">
                                <span class="badge badge-hot"><i class="fa-solid fa-fire"></i> 热度 ${item.hot || '飙升'}</span>
                                <span>今日头条</span>
                                <span>自动采集</span>
                            </div>
                        `;
                    } else if (index % 3 === 2) {
                        card.innerHTML = `
                            <h2 class="card-title">${index + 1}. ${item.title}</h2>
                            <img class="single-large-image" src="https://picsum.photos/id/${index + 60}/500/280" alt="新闻大图">
                            <div class="card-meta">
                                <span class="badge badge-top">热</span>
                                <span>头条热点源</span>
                                <span>实时同步</span>
                            </div>
                        `;
                    } else {
                        card.innerHTML = `
                            <h2 class="card-title">${index + 1}. ${item.title}</h2>
                            <div class="card-meta">
                                <span class="badge badge-hot">今日焦点</span>
                                <span>权威媒体</span>
                                <span>更新于刚刚</span>
                            </div>
                            <div class="action-bar">
                                <div class="action-item"><i class="fa-solid fa-share"></i> <span>转发</span></div>
                                <div class="action-item"><i class="fa-regular fa-comment"></i> <span>${parseInt(Math.random()*1000)}</span></div>
                                <div class="action-item"><i class="fa-regular fa-thumbs-up"></i> <span>赞</span></div>
                            </div>
                        `;
                    }
                    container.appendChild(card);
                });
            } else {
                throw new Error("API格式变更，切换内部富媒体库");
            }
        } catch (error) {
            console.log("外部实时接口触发防爬虫限制，已自动无缝激活高保真本地丰富内容区。", error);
            // 渲染默认的“推荐”频道丰富内容
            renderChannelData('recommend');
        }
    }

    // 导航频道自主切换逻辑
    function switchChannel(channelKey, element) {
        // 清除之前的Active
        const items = document.querySelectorAll('.nav-item');
        items.forEach(item => item.classList.remove('active'));
        element.classList.add('active');

        renderChannelData(channelKey);
    }

    // 渲染指定频道的丰富数据方法
    function renderChannelData(key) {
        const container = document.getElementById('news-container');
        container.innerHTML = ''; // 清空容器

        // 设置搜索栏提示词
        const keywords = { recommend: "习近平总书记微镜头", tech: "全固态电池量产时间表", hot: "春节档电影总票房破百亿" };
        document.getElementById('search-keyword').innerText = keywords[key] || "搜你想看的";

        const dataList = mockDatabase[key] || mockDatabase['recommend'];

        dataList.forEach(item => {
            const card = document.createElement('div');
            card.className = 'news-card';

            if (item.type === 'text') {
                card.innerHTML = `
                    <h2 class="card-title">${item.title}</h2>
                    <div class="card-meta">
                        ${item.isTop ? '<span class="badge badge-top">置顶</span>' : ''}
                        ${item.isHot ? '<span class="badge badge-hot">热点</span>' : ''}
                        <span>${item.source}</span>
                        <span>${item.comment}评论</span>
                        <span>${item.time}</span>
                    </div>
                `;
            } else if (item.type === 'feed') {
                card.innerHTML = `
                    <div class="author-section">
                        <div class="author-left">
                            <img class="author-avatar" src="${item.avatar}">
                            <div>
                                <div class="author-name">${item.author} <i class="fa-solid fa-circle-check" style="color:#ffb300; font-size:12px;"></i></div>
                                <div class="author-desc">${item.desc}</div>
                            </div>
                        </div>
                        <div class="follow-btn">关注</div>
                    </div>
                    <div class="feed-text">${item.text}</div>
                    <img class="single-large-image" src="${item.img}">
                    <div class="action-bar">
                        <div class="action-item"><i class="fa-solid fa-share"></i> <span>${item.shares}</span></div>
                        <div class="action-item"><i class="fa-regular fa-comment"></i> <span>${item.comments}</span></div>
                        <div class="action-item"><i class="fa-regular fa-thumbs-up"></i> <span>${item.likes}</span></div>
                    </div>
                `;
            } else if (item.type === 'three-img') {
                card.innerHTML = `
                    <h2 class="card-title">${item.title}</h2>
                    <div class="image-grid">
                        <img src="${item.imgs[0]}">
                        <img src="${item.imgs[1]}">
                        <img src="${item.imgs[2]}">
                    </div>
                    <div class="card-meta">
                        <span>${item.source}</span>
                        <span>${item.comment}评论</span>
                        <span>${item.time}</span>
                    </div>
                `;
            } else if (item.type === 'large-img') {
                card.innerHTML = `
                    <h2 class="card-title">${item.title}</h2>
                    <img class="single-large-image" src="${item.img}">
                    <div class="card-meta">
                        <span class="badge badge-ad">广告</span>
                        <span>${item.source}</span>
                        <span>${item.comment}评论</span>
                        <span>${item.time}</span>
                    </div>
                `;
            }
            container.appendChild(card);
        });
    }
</script>
</body>
</html>
