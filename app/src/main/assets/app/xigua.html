<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>西瓜视频-点亮对生活的好奇心</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f8f8f8;
            color: #222;
            padding-top: 84px; /* 留出顶部固定导航的位置 */
            padding-bottom: 50px; /* 留出底部标签栏的位置 */
        }

        /* --- 顶部固定区域 --- */
        .header-fixed {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background-color: #fff;
        }

        /* 顶部搜索栏 */
        .top-bar {
            display: flex;
            align-items: center;
            padding: 6px 12px;
            height: 44px;
        }

        .logo {
            font-size: 18px;
            font-weight: bold;
            color: #ff2a44; /* 西瓜红 */
            margin-right: 12px;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
        }

        .logo svg {
            width: 24px;
            height: 24px;
            margin-right: 2px;
            fill: #ff2a44;
        }

        .search-box {
            flex: 1;
            height: 32px;
            background-color: #f3f3f4;
            border-radius: 16px;
            display: flex;
            align-items: center;
            padding: 0 12px;
            color: #666;
            font-size: 13px;
        }

        .search-box svg {
            width: 14px;
            height: 14px;
            fill: #999;
            margin-right: 6px;
        }

        .top-icon {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            margin-left: 8px;
        }

        .top-icon svg {
            width: 22px;
            height: 22px;
            fill: #333;
        }

        /* 分类金刚位导航 */
        .nav-bar {
            display: flex;
            overflow-x: auto;
            white-space: nowrap;
            height: 40px;
            align-items: center;
            padding: 0 8px;
            border-bottom: 1px solid #f0f0f0;
        }

        .nav-bar::-webkit-scrollbar {
            display: none; /* 隐藏滚动条 */
        }

        .nav-item {
            display: inline-block;
            padding: 0 10px;
            font-size: 15px;
            color: #555;
            text-decoration: none;
            position: relative;
            height: 100%;
            line-height: 40px;
        }

        .nav-item.active {
            color: #ff2a44;
            font-weight: bold;
            font-size: 16px;
        }

        .nav-item.active::after {
            content: '';
            position: absolute;
            bottom: 2px;
            left: 50%;
            transform: translateX(-50%);
            width: 16px;
            height: 2.5px;
            background-color: #ff2a44;
            border-radius: 2px;
        }

        /* --- 视频列表流 --- */
        .video-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .video-card {
            background-color: #fff;
            display: flex;
            flex-direction: column;
        }

        /* 视频封面图区域 */
        .video-cover-wrapper {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 比例 */
            background-color: #000;
            overflow: hidden;
        }

        .video-cover {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 封面上的播放按钮和时长 */
        .video-play-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 44px;
            height: 44px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(2px);
        }

        .video-play-btn svg {
            width: 20px;
            height: 20px;
            fill: #fff;
            margin-left: 2px;
        }

        .video-duration {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background-color: rgba(0, 0, 0, 0.7);
            color: #fff;
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 4px;
        }

        /* 视频信息区域 */
        .video-info {
            padding: 12px;
        }

        .video-title {
            font-size: 15px;
            font-weight: 500;
            line-height: 1.4;
            color: #161823;
            margin-bottom: 8px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* 创作者信息和互动 */
        .video-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .author-box {
            display: flex;
            align-items: center;
        }

        .author-avatar {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            margin-right: 6px;
            object-fit: cover;
            border: 1px solid #f0f0f0;
        }

        .author-name {
            font-size: 12px;
            color: #555;
            max-width: 120px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .interaction-box {
            display: flex;
            align-items: center;
            gap: 16px;
            color: #666;
            font-size: 12px;
        }

        .inter-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .inter-item svg {
            width: 16px;
            height: 16px;
            fill: #555;
        }

        /* --- 底部导航栏 --- */
        .tab-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 50px;
            background-color: #fff;
            border-top: 1px solid #e8e8e8;
            display: flex;
            z-index: 100;
        }

        .tab-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #777;
            text-decoration: none;
            font-size: 10px;
            gap: 2px;
        }

        .tab-item svg {
            width: 22px;
            height: 22px;
            fill: #777;
        }

        .tab-item.active {
            color: #ff2a44;
        }

        .tab-item.active svg {
            fill: #ff2a44;
        }
    </style>
</head>
