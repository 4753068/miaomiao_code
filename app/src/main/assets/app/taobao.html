<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>淘宝网 - 触屏版首页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            background-color: #f4f4f4;
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
            color: #333;
            padding-top: 54px;
            padding-bottom: 54px;
        }

        /* --- 1. 顶部固定搜索区域 --- */
        .header-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 90;
            background-color: #ffffff;
            height: 50px;
            padding: 0 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tb-logo-text {
            color: #ff5000;
            font-size: 21px;
            font-weight: bold;
            flex-shrink: 0;
            letter-spacing: -0.5px;
        }

        .search-box-container {
            flex: 1;
            height: 34px;
            border: 1px solid #ff5000;
            border-radius: 17px;
            display: flex;
            align-items: center;
            padding-left: 14px;
            padding-right: 2px;
            background-color: #ffffff;
        }

        .search-input-placeholder {
            flex: 1;
            font-size: 13px;
            color: #666666;
        }

        .search-submit-btn {
            background: linear-gradient(90deg, #ff9000 0%, #ff5000 100%);
            color: #ffffff;
            border: none;
            height: 28px;
            padding: 0 16px;
            border-radius: 14px;
            font-size: 13px;
            font-weight: bold;
        }

        .signin-bonus {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff6b6b, #ff8787);
            border: 1px solid #ffe3e3;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 8px;
            font-weight: bold;
            line-height: 1.1;
        }
        .signin-bonus span { transform: scale(0.85); display: block; }

        /* --- 2. 行业金刚位 --- */
        .kingkong-section {
            background-color: #ffffff;
            padding: 12px 0 8px 0;
            border-bottom-left-radius: 12px;
            border-bottom-right-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .kingkong-scroller {
            width: 100%;
            display: flex;
            overflow-x: auto;
            padding: 0 4px;
            gap: 2px;
        }
        .kingkong-scroller::-webkit-scrollbar { display: none; }

        .kingkong-node {
            min-width: 19%;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            text-decoration: none;
        }

        .icon-circle {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .kingkong-node span { font-size: 11px; color: #555555; }

        .indicator-bar { display: flex; gap: 3px; margin-top: 8px; }
        .dot { width: 6px; height: 3px; border-radius: 1.5px; background-color: #e0e0e0; }
        .dot.active { background-color: #ff5000; }

        /* --- 3. 瀑布流双列商品流 --- */
        .goods-waterfall {
            padding: 8px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .goods-item-card {
            background-color: #ffffff;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .image-container-square {
            width: 100%;
            padding-top: 100%;
            position: relative;
            background-color: #f7f7f7;
        }

        .image-container-square img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .info-content-box {
            padding: 10px 8px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex: 1;
        }

        .item-title-text {
            font-size: 13px;
            color: #222222;
            line-height: 1.4;
            height: 36px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .item-price-row { color: #ff5000; font-weight: bold; font-size: 15px; }
        .item-price-row::before { content: '¥'; font-size: 11px; margin-right: 1px; }

        /* --- 4. 固底全局导航 --- */
        .bottom-nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 50px;
            background-color: #ffffff;
            border-top: 1px solid #e5e5e5;
            display: flex;
            z-index: 90;
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }

        .nav-tab-button {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: #5d5d5d;
            gap: 2px;
        }

        .nav-tab-button svg { width: 22px; height: 22px; fill: #5d5d5d; }
        .nav-tab-button span { font-size: 10px; }
        .nav-tab-button.active { color: #ff5000; }
        .nav-tab-button.active svg { fill: #ff5000; }


        /* ==========================================
           🔥 核心强化：强管制（无法退出）登录遮罩层
           ========================================== */
        .login-modal-mask {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ffffff;
            z-index: 200; /* 绝对置顶 */
            opacity: 0;
            pointer-events: none;
            transform: translateY(100%);
            transition: all 0.35s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .login-modal-mask.show {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }

        .login-wrapper {
            padding: 44px 24px 24px;
            display: flex;
            flex-direction: column;
            height: 100%;
            justify-content: space-between;
        }

        /* 顶部操作行：移除了左侧关闭X图标，仅剩右侧装饰文本，使其无法关闭 */
        .top-action {
            display: flex;
            justify-content: flex-end; /* 靠右排列 */
            align-items: center;
            font-size: 15px;
            color: #555555;
            margin-bottom: 32px;
            height: 24px;
        }

        .welcome-title {
            font-size: 26px;
            font-weight: 600;
            color: #000000;
            margin-bottom: 36px;
        }

        .input-group {
            position: relative;
            border-bottom: 1px solid #f0f0f0;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            height: 52px;
        }

        .input-group:focus-within { border-bottom-color: #ff5000; }
        .input-group input {
            width: 100%; height: 100%; border: none; outline: none; font-size: 16px; color: #111;
        }

        .protocol-box {
            display: flex;
            align-items: flex-start;
            margin-top: 18px;
            margin-bottom: 24px;
        }

        .checkbox-container {
            position: relative; display: inline-block; width: 16px; height: 16px; margin-right: 8px; margin-top: 2px; flex-shrink: 0;
        }
        .checkbox-container input { opacity: 0; width: 0; height: 0; }
        .checkmark {
            position: absolute; top: 0; left: 0; width: 16px; height: 16px; border: 1px solid #ccc; border-radius: 50%; background-color: #fff;
        }
        .checkbox-container input:checked + .checkmark { background-color: #ff5000; border-color: #ff5000; }
        .checkbox-container input:checked + .checkmark::after {
            content: ""; position: absolute; left: 5px; top: 2px; width: 4px; height: 7px; border: solid white; border-width: 0 1.5px 1.5px 0; transform: rotate(45deg);
        }

        .protocol-text { font-size: 12px; color: #666; }
        .protocol-text a { color: #ff5000; text-decoration: none; }

        .submit-btn {
            width: 100%; height: 48px;
            background: linear-gradient(90deg, #ff9000 0%, #ff5000 100%);
            color: #ffffff; border: none; border-radius: 24px; font-size: 16px; font-weight: 600; cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 80, 0, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sub-links { display: flex; justify-content: space-between; margin-top: 20px; font-size: 14px; }
        .sub-links a { color: #555; text-decoration: none; }

        .bottom-area { text-align: center; margin-top: 40px; }
        .oauth-title { font-size: 12px; color: #ccc; margin-bottom: 24px; display: flex; align-items: center; justify-content: center; gap: 12px; }
        .oauth-title::before, .oauth-title::after { content: ""; height: 1px; background-color: #ededed; flex: 1; max-width: 60px; }
        .oauth-group { display: flex; justify-content: center; gap: 32px; }
        .oauth-item { width: 44px; height: 44px; border-radius: 50%; border: 1px solid #e8e8e8; display: flex; align-items: center; justify-content: center; }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-4px); }
            40%, 80% { transform: translateX(4px); }
        }
        .shake { animation: shake 0.4s ease-in-out; }
    </style>
</head>
<body>

<div class="header-bar">
    <div class="tb-logo-text">淘宝</div>
    <div class="search-box-container">
        <div class="search-input-placeholder">寻找宝贝店铺</div>
        <button class="search-submit-btn">搜索</button>
    </div>
    <div class="signin-bonus"><span>🧧</span><span style="margin-top: -2px;">签到</span></div>
</div>

<div class="kingkong-section">
    <div class="kingkong-scroller">
        <div class="kingkong-node">
            <div class="icon-circle" style="background-color: #ffeff0;">
                <svg width="24" height="24" viewBox="0 0 24 24"><path fill="#ff3344" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
            </div>
            <span>淘票票</span>
        </div>
        <div class="kingkong-node">
            <div class="icon-circle" style="background-color: #fffde7;">
                <svg width="24" height="24" viewBox="0 0 24 24"><path fill="#fbc02d" d="M2.5 19h19v2h-19zm16.78-6.15l-1.42 1.41-5.3-5.3 1.42-1.42c.39-.39 1.02-.39 1.42 0l3.88 3.89c.39.39.39 1.02 0 1.42z"/></svg>
            </div>
            <span>飞猪旅行</span>
        </div>
        <div class="kingkong-node">
            <div class="icon-circle" style="background-color: #f3e5f5;">
                <svg width="24" height="24" viewBox="0 0 24 24"><path fill="#a124a8" d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10zM8.5 11a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z"/></svg>
            </div>
            <span>连连消</span>
        </div>
        <div class="kingkong-node">
            <div class="icon-circle" style="background-color: #e1f5fe;">
                <svg width="24" height="24" viewBox="0 0 24 24"><path fill="#0288d1" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6z"/></svg>
            </div>
            <span>U先试用</span>
        </div>
        <div class="kingkong-node">
            <div class="icon-circle" style="background-color: #ffebee;">
                <svg width="24" height="24" viewBox="0 0 24 24"><path fill="#e53935" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3z"/></svg>
            </div>
            <span>聚划算</span>
        </div>
    </div>
    <div class="indicator-bar"><div class="dot active"></div><div class="dot"></div></div>
</div>

<div class="goods-waterfall">
    <div class="goods-item-card">
        <div class="image-container-square"><img src="https://images.unsplash.com/photo-1601004890684-d8cbf643f5f2?w=400&q=80" alt="蓝莓果酱"></div>
        <div class="info-content-box">
            <div class="item-title-text">野生蓝莓果酱大颗粒果肉纯熬果酱蓝莓山药烘焙蓝</div>
            <div class="item-price-row">49.5</div>
        </div>
    </div>
    <div class="goods-item-card">
        <div class="image-container-square"><img src="https://images.unsplash.com/photo-1586201375761-83865001e31c?w=400&q=80" alt="薏米仁"></div>
        <div class="info-content-box">
            <div class="item-title-text">寻百草薏米仁新货农家薏米500克以仁薏苡仁正宗小</div>
            <div class="item-price-row">10.8</div>
        </div>
    </div>
    <div class="goods-item-card">
        <div class="image-container-square"><img src="https://images.unsplash.com/photo-1631679706909-1844bbd07221?w=400&q=80" alt="蚕丝枕"></div>
        <div class="info-content-box">
            <div class="item-title-text">偏高偏硬枕芯蚕丝决明子草本呵护柔软支撑恰到好处</div>
            <div class="item-price-row">88.0</div>
        </div>
    </div>
    <div class="goods-item-card">
        <div class="image-container-square"><img src="https://images.unsplash.com/photo-1513519245088-0e12902e5a38?w=400&q=80" alt="蔬菜人偶"></div>
        <div class="info-content-box">
            <div class="item-title-text">儿童节礼物春色满园蔬菜人偶可爱客厅桌面创意小摆件</div>
            <div class="item-price-row">26.5</div>
        </div>
    </div>
</div>

<div class="bottom-nav-bar">
    <div class="nav-tab-button active"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/></svg><span>淘宝</span></div>
    <div class="nav-tab-button"><svg viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2z"/></svg><span>购物车</span></div>
    <div class="nav-tab-button"><svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s1.79-4 4-4"/></svg><span>我的淘宝</span></div>
</div>


<div class="login-modal-mask" id="loginModal">
    <div class="login-wrapper">
        <div class="main-form">
            <div class="top-action">
                <span style="color: #666; font-size: 14px;">免费注册</span>
            </div>

            <div class="welcome-title">您好，欢迎登录淘宝</div>

            <div class="input-group">
                <input type="text" id="username" placeholder="手机号/邮箱/会员名" autocomplete="off">
            </div>

            <div class="input-group">
                <input type="password" id="password" placeholder="请输入登录密码" autocomplete="off">
            </div>

            <div class="protocol-box" id="protocolWrapper">
                <label class="checkbox-container">
                    <input type="checkbox" id="protocolCheck">
                    <span class="checkmark"></span>
                </label>
                <span class="protocol-text">
                        已阅读并同意双方<a href="#">淘宝平台服务协议</a>、<a href="#">隐私权政策</a>，并授权使用您的淘宝账号信息以供登录。
                    </span>
            </div>

            <button class="submit-btn" id="loginSubmitBtn" onclick="handleLoginSubmit()">登录</button>

            <div class="sub-links">
                <a href="#" style="color: #ff5000;">短信验证码登录</a>
                <a href="#">忘记密码</a>
            </div>
        </div>

        <div class="bottom-area">
            <div class="oauth-title">其他方式登录</div>
            <div class="oauth-group">
                <div class="oauth-item" style="border-color:#e1f5fe;"><svg viewBox="0 0 24 24" width="24" height="24"><path fill="#07C160" d="M8.5 14c-.28 0-.5-.22-.5-.5s.22-.5 0.5-.5.5.22.5 0.5zm7 0c-.28 0-.5-.22-.5-.5s.22-.5 0.5-.5z"/></svg></div>
                <div class="oauth-item" style="border-color:#e3f2fd;"><svg viewBox="0 0 24 24" width="24" height="24"><path fill="#1677FF" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10z"/></svg></div>
            </div>
        </div>
    </div>
</div>

<script>
    // 页面打开 2000毫秒（2秒）后，无条件激活登录浮层
    window.addEventListener('DOMContentLoaded', () => {
        setTimeout(() => {
            document.getElementById('loginModal').classList.add('show');
        }, 2000);
    });

    // 核心跳转与机制控制
    function handleLoginSubmit() {
        const check = document.getElementById('protocolCheck');
        const wrapper = document.getElementById('protocolWrapper');
        const submitBtn = document.getElementById('loginSubmitBtn');

        // 协议强校验：未勾选时触发高级抖动效果，无法跳过
        if (!check.checked) {
            wrapper.classList.remove('shake');
            void wrapper.offsetWidth; // 触发硬件回流重绘
            wrapper.classList.add('shake');
            return;
        }

        const u = document.getElementById('username').value.trim();
        const p = document.getElementById('password').value.trim();

        // 表单输入校验：必须随便输入一些内容
        if(!u || !p) {
            alert('请在上方输入任意账号和密码进行登录验证！');
            return;
        }

        // 验证通过，执行解锁跳转，登录层向下滑动退场
        submitBtn.innerHTML = "正在安全跳转首页...";
        submitBtn.style.opacity = "0.8";

        setTimeout(() => {
            // 恢复默认设置并解锁页面
            document.getElementById('loginModal').classList.remove('show');
            submitBtn.innerHTML = "登录";
            submitBtn.style.opacity = "1";

            // 清理输入数据
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
        }, 800);
    }
</script>
</body>
</html>
