<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>获取账号</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-main: #111111;
            --text-sub: #999999;
            --text-warn: #e54d42;
            --color-blue: #1a65ff;
            --bg-box: #f5f6f8;
            --border-radius-sm: 12px;
        }

        body, html {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
            display: flex;
            justify-content: center;
        }

        .settings-container {
            width: 100%;
            max-width: 480px;
            padding: 40px 24px 100px 24px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .brand-name {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 30px;
            letter-spacing: -0.3px;
        }

        .page-title {
            font-size: 26px;
            font-weight: 700;
            text-align: center;
            margin: 0 0 10px 0;
            line-height: 1.3;
            color: var(--text-main);
            letter-spacing: -0.5px;
        }

        .page-subtitle {
            font-size: 14px;
            color: var(--text-sub);
            text-align: center;
            margin-bottom: 32px;
        }

        /* 账号网格布局区域 */
        .accounts-container {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 24px;
            max-height: 50vh;
            overflow-y: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .accounts-container::-webkit-scrollbar {
            display: none;
        }

        .account-item {
            background-color: var(--bg-box);
            padding: 16px 8px;
            border-radius: var(--border-radius-sm);
            font-size: 15px;
            font-weight: 600;
            color: var(--text-main);
            word-break: break-all;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .account-item:active {
            transform: scale(0.95);
            background-color: #eef0f3;
        }

        .account-index {
            color: var(--text-sub);
            font-size: 12px;
            font-weight: 400;
        }

        /* 表单区域 */
        .form-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 24px;
        }

        .input-wrapper {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
        }

        .input-label {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
        }

        .text-input {
            width: 100%;
            background-color: var(--bg-box);
            border: 1.5px solid transparent;
            border-radius: var(--border-radius-sm);
            font-size: 16px;
            font-weight: 500;
            color: var(--text-main);
            padding: 16px;
            outline: none;
            box-sizing: border-box;
            transition: all 0.2s ease;
        }

        .text-input:focus {
            background-color: #ffffff;
            border-color: var(--color-blue);
            box-shadow: 0 0 0 3px rgba(26, 101, 255, 0.15);
        }

        /* 状态提示 */
        .hint-text {
            font-size: 13px;
            line-height: 1.5;
            text-align: center;
            min-height: 20px;
            margin-bottom: 24px;
            width: 100%;
        }
        .hint-text.error { color: var(--text-warn); font-weight: 500; }
        .hint-text.normal { color: var(--text-sub); }
        .hint-text.success { color: #38a169; font-weight: 500; }

        /* 底部按钮 */
        .action-area {
            width: 100%;
            margin-top: auto;
        }

        .btn {
            width: 100%;
            height: 54px;
            border-radius: 27px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
            -webkit-tap-highlight-color: transparent;
            margin-bottom: 14px;
        }

        .btn:active {
            transform: scale(0.98);
            opacity: 0.9;
        }

        .btn-primary {
            background-color: var(--color-blue);
            color: #ffffff;
        }
        .btn-primary:disabled {
            background-color: #a0aec0;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--text-sub);
            font-size: 14px;
        }
        .btn-secondary:active {
            background-color: #f5f6f8;
            transform: none;
        }

        [v-cloak] { display: none !important; }
    </style>
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
</head>
<body>

<div id="app" v-cloak>
    <div v-if="currentPage === 'list'" class="settings-container">
        <div class="brand-name">喵喵</div>
        <h1 class="page-title">获取账号</h1>
        <p class="page-subtitle">一键获取最新可用系统账号，点击号码进行设置</p>

        <div class="accounts-container" v-if="accounts.length > 0">
            <div class="account-item" v-for="(item, index) in accounts" :key="index" @click="goSetPassword(item.number)">
                <span class="account-index">#{{ index + 1 }}</span>
                <span class="account-number">{{ item.number }}</span>
            </div>
        </div>

        <div class="hint-text" :class="statusClass">
            {{ statusMessage }}
        </div>

        <div class="action-area">
            <button class="btn btn-primary" @click="fetchAccounts" :disabled="isLoading">
                {{ isLoading ? '获取中...' : '刷新数据' }}
            </button>
            <button class="btn btn-secondary" @click="handleCancel">
                返回
            </button>
        </div>
    </div>

    <div v-if="currentPage === 'password'" class="settings-container">
        <div class="brand-name">喵喵</div>
        <h1 class="page-title">设置密码</h1>
        <p class="page-subtitle">正在为账号 [ {{ selectedNumber }} ] 配置访问密码</p>

        <div class="form-group">
            <div class="input-wrapper">
                <div class="input-label">新密码 <span style="color: var(--text-warn);">*</span></div>
                <input type="password" class="text-input" v-model="password" placeholder="请输入新密码">
            </div>

            <div class="input-wrapper">
                <div class="input-label">确认密码 <span style="color: var(--text-warn);">*</span></div>
                <input type="password" class="text-input" v-model="confirmPassword" placeholder="请再次输入新密码">
            </div>
        </div>

        <div class="hint-text" :class="statusClass">
            {{ statusMessage }}
        </div>

        <div class="action-area">
            <button class="btn btn-primary" @click="savePassword" :disabled="isLoading">
                {{ isLoading ? '正在保存...' : '保存修改' }}
            </button>
            <button class="btn btn-secondary" @click="goBackToList">
                返回列表
            </button>
        </div>
    </div>
</div>

<script>
    const { createApp, ref, computed, onMounted } = Vue;

    createApp({
        setup() {
            const currentPage = ref('list');
            const accounts = ref([]);
            const selectedNumber = ref('');
            const password = ref('');
            const confirmPassword = ref(''); // 确认密码字段
            const isLoading = ref(false);

            const feedbackStatus = ref('normal');
            const feedbackMessage = ref('正在获取账号数据...');

            const statusClass = computed(() => ({
                'error': feedbackStatus.value === 'error',
                'normal': feedbackStatus.value === 'normal',
                'success': feedbackStatus.value === 'success'
            }));
            const statusMessage = computed(() => feedbackMessage.value);

            // 自动获取账号列表
            const fetchAccounts = () => {
                isLoading.value = true;
                feedbackStatus.value = 'normal';
                feedbackMessage.value = '正在连接服务器...';
                accounts.value = [];

                fetch('https://member.am930.cn/?data=member&file=member&func=get_kami', {
                    method: 'GET'
                })
                .then(response => response.json())
                .then(res => {
                    if (res.code === 1 && Array.isArray(res.number)) {
                        if (res.number.length > 0) {
                            accounts.value = res.number;
                            feedbackStatus.value = 'success';
                            feedbackMessage.value = `成功获取 ${res.number.length} 个账号`;
                        } else {
                            feedbackStatus.value = 'normal';
                            feedbackMessage.value = '当前暂无可用账号';
                        }
                    } else {
                        feedbackStatus.value = 'error';
                        feedbackMessage.value = res.msg || '获取失败，服务器返回数据异常';
                    }
                })
                .catch(error => {
                    console.error("请求失败:", error);
                    feedbackStatus.value = 'error';
                    feedbackMessage.value = '网络请求失败，请检查网络后重试。';
                })
                .finally(() => {
                    isLoading.value = false;
                });
            };

            // 进入设置密码界面
            const goSetPassword = (num) => {
                selectedNumber.value = num;
                password.value = '';
                confirmPassword.value = ''; // 进入时同样清空确认密码框
                feedbackStatus.value = 'normal';
                feedbackMessage.value = '请设置并确认您的新密码';
                currentPage.value = 'password';
            };

            // 保存密码
            const savePassword = () => {
                const pwd = password.value.trim();
                const confirmPwd = confirmPassword.value.trim();

                // 校验非空
                if (!pwd || !confirmPwd) {
                    feedbackStatus.value = 'error';
                    feedbackMessage.value = '新密码和确认密码均不能为空。';
                    return;
                }

                // 校验两次密码是否一致
                if (pwd !== confirmPwd) {
                    feedbackStatus.value = 'error';
                    feedbackMessage.value = '两次输入的密码不一致，请重新输入。';
                    return;
                }

                isLoading.value = true;
                feedbackStatus.value = 'normal';
                feedbackMessage.value = '正在保存密码...';

                const postData = new URLSearchParams();
                postData.append('kami', selectedNumber.value);
                postData.append('password', pwd); // 依旧提交用户输入的内容

                fetch('https://member.am930.cn/?data=miaomiao&file=member&func=save_member_kami', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: postData.toString()
                })
                .then(response => response.json())
                .then(res => {
                    feedbackStatus.value = 'success';
                    feedbackMessage.value = '密码设置成功！';

                    setTimeout(() => {
                        goBackToList();
                    }, 1500);
                })
                .catch(error => {
                    console.error("保存失败:", error);
                    feedbackStatus.value = 'error';
                    feedbackMessage.value = '保存失败，请检查网络重试。';
                })
                .finally(() => {
                    isLoading.value = false;
                });
            };

            const goBackToList = () => {
                feedbackStatus.value = 'success';
                feedbackMessage.value = `当前有 ${accounts.value.length} 个账号`;
                currentPage.value = 'list';
            };

            const handleCancel = () => {
                if (window.AndroidBridge && typeof window.AndroidBridge.closePage === 'function') {
                    window.AndroidBridge.closePage();
                } else {
                    window.history.back();
                }
            };

            onMounted(() => {
                fetchAccounts();
            });

            return {
                currentPage,
                accounts,
                selectedNumber,
                password,
                confirmPassword,
                isLoading,
                statusClass,
                statusMessage,
                fetchAccounts,
                goSetPassword,
                savePassword,
                goBackToList,
                handleCancel
            };
        }
    }).mount('#app');
</script>
</body>
</html>
