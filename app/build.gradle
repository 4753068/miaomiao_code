android {
    namespace 'com.qapp.midian'
    compileSdk {
        version = release(36)
    }

    defaultConfig {
        applicationId "com.qapp.midian"
        minSdk 26
        //noinspection OldTargetApi
        targetSdk 36
        versionCode 84
        versionName "3.14"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        config {
            keyAlias 'key0'
            keyPassword 'zhixuan52099'
            storeFile file('midian.jks')
            storePassword 'zhixuan52099'
        }
    }

    buildTypes {
        debug {
            // 如果本地存在签名文件则签名，否则使用默认 debug 签名，保证其他人编译时不报错
            if (file('midian.jks').exists()) {
                signingConfig signingConfigs.config
            }
        }
        release {
            if (file('midian.jks').exists()) {
                signingConfig signingConfigs.config
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    ndkVersion '26.1.10909125'

}

configurations.all {
    // 强制全局排除废弃的 kotlin-android-extensions-runtime，避免版本冲突
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-android-extensions-runtime'
}

dependencies {
    // AndroidX 基础核心库
    implementation("androidx.core:core:1.16.0")
    implementation("androidx.core:core-ktx:1.16.0")
    implementation libs.androidx.appcompat
    implementation libs.material
    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core

    // 网络请求组件
    implementation("com.squareup.okhttp3:okhttp:4.9.0")
    implementation 'io.reactivex.rxjava2:rxjava:2.1.3'
    implementation 'io.reactivex.rxjava2:rxandroid:2.0.1'
    implementation 'com.ejlchina:okhttps:3.3.0'

    // 图片加载与高斯/圆角样式转换
    implementation 'com.makeramen:roundedimageview:2.3.0'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'com.github.bumptech.glide:gifdecoder:4.16.0'
    implementation 'jp.wasabeef:glide-transformations:4.3.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

    // 二维码扫描与生成
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'com.google.zxing:core:3.3.0'

    // 生物识别与指纹验证
    implementation "androidx.biometric:biometric:1.1.0"

    // Android 工具箱
    implementation 'com.blankj:utilcodex:1.31.1'

    // 页面交互与状态栏
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.readystatesoftware.systembartint:systembartint:1.0.3'

    // ViewPager2 与大图查看器
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'com.github.chrisbanes:PhotoView:2.3.0'

    // 本地广播组件
    implementation "androidx.localbroadcastmanager:localbroadcastmanager:1.1.0"

    // 媒体核心播放引擎（统一使用 1.3.1，避免冲突）
    implementation "androidx.media3:media3-exoplayer:1.3.1"
    implementation "androidx.media3:media3-ui:1.3.1"

    // 动图与 APNG
    implementation 'com.github.penfeizhou.android.animation:apng:3.0.5'
    implementation 'com.linecorp:apng:1.12.0'

    // 图片裁剪与列表动效
    implementation 'com.github.yalantis:ucrop:2.2.8'
    implementation 'jp.wasabeef:recyclerview-animators:4.0.2'

    // 进程与生命周期监控
    implementation "androidx.lifecycle:lifecycle-process:2.8.2"

    // 视频轻量压缩
    implementation 'com.github.AbedElazizShe:LightCompressor:1.3.3'

    // 高德定位 SDK
    implementation 'com.amap.api:location:latest.integration'

    implementation files('libs/miaomiao_auth-release.aar')
}